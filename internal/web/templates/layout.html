{{define "head"}}<!doctype html>
<html lang="{{.L.Code}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/main.js"></script>
</head>
<body>
  <a class="skip" href="#content">{{.L.T "skip"}}</a>
  <nav>
    <a class="brand" href="/">edugit</a>
    {{if .User}}
    <span class="who">{{.User.Username}}</span>
    <a href="/account/tokens">{{.L.T "nav.tokens"}}</a>
    {{if .User.IsAdmin}}<a href="/admin/audit">{{.L.T "nav.audit"}}</a>{{end}}
    {{else if .LoginURL}}
    <a href="{{.LoginURL}}">{{.L.T "nav.signin"}}</a>
    {{end}}
    <span class="grow"></span>
    <form method="post" action="/lang" class="langs">
      <input type="hidden" name="next" value="{{.Path}}">
      {{range .Langs}}<button name="lang" value="{{.Code}}"{{if eq .Code $.L.Code}} aria-current="true"{{end}} lang="{{.Code}}">{{.Name}}</button>{{end}}
    </form>
    {{if .User}}
    <form method="post" action="/logout">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <button>{{.L.T "nav.signout"}}</button>
    </form>
    {{end}}
  </nav>
  <main id="content">
{{end}}
{{define "foot"}}  </main>
</body>
</html>
{{end}}
