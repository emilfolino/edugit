{{template "head" .}}
    {{template "browsehead" .}}
    {{with .Edit}}
    {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
    {{end}}
    <form method="post" action="{{.Browse.Base}}/edit">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <input type="hidden" name="ref" value="{{.Browse.Ref}}">
      <input type="hidden" name="base" value="{{.Edit.Base}}">
      <label>{{$.L.T "edit.path"}} <input name="path" value="{{.Browse.Path}}" required{{if not .Edit.New}} readonly{{end}}></label>
      <textarea name="content" rows="24" spellcheck="false" data-editor data-path="{{.Browse.Path}}" class="editor">{{.Edit.Content}}</textarea>
      <label>{{$.L.T "edit.message"}} <input name="message" value="{{.Edit.Message}}" required></label>
      <label>{{$.L.T "edit.newbranch"}} <input name="new_branch" value="{{.Edit.NewName}}" pattern="[A-Za-z0-9._/-]+"></label>
      <button type="submit">{{$.L.T "common.commit"}}</button>
      {{if not .Edit.New}}<button type="submit" name="delete" value="1">{{$.L.T "edit.deletefile"}}</button>{{end}}
      <a href="{{.Browse.Base}}/tree{{.Browse.Q}}">{{$.L.T "common.cancel"}}</a>
    </form>
{{template "foot" .}}
