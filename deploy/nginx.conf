server {
    listen 443 ssl http2;
    server_name git.example.edu;
    # ssl_certificate / ssl_certificate_key: e.g. from certbot.

    client_max_body_size 600m;       # git pushes
    proxy_request_buffering off;     # stream pushes instead of spooling to disk
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        # Must overwrite, not append: edugit trusts the last entry.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
