# Drop-in: /etc/systemd/system/edugit.service.d/ci.conf
# Enables the CI runner with rootless podman. Podman needs user namespaces and
# a home directory (for its image store) owned by the service user, so this
# relaxes the sandbox of the *server*; the jobs themselves still run in
# containers with no network, no capabilities and a read-only root.
#
# One-time setup:
#   useradd --system --home-dir /var/lib/edugit-ci --create-home edugit-ci   # or reuse edugit
#   echo 'edugit:100000:65536' >> /etc/subuid; echo 'edugit:100000:65536' >> /etc/subgid
[Service]
ExecStart=
ExecStart=/usr/local/bin/edugit -ci-runtime podman -ci-workers 2
RestrictNamespaces=no
Environment=HOME=/var/lib/edugit/ci-home
Environment=XDG_RUNTIME_DIR=/var/lib/edugit/ci-run
ReadWritePaths=/var/lib/edugit
